<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="motion-director. One line in. A film out.">
<style>
.h{font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif;font-size:168px;letter-spacing:1px;fill:#f2efe6}
.s{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:34px;font-weight:600;fill:#8a8780}
.w{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;letter-spacing:6px;fill:#f2efe6}
@keyframes slam{0%{opacity:0;transform:translateY(46px) scale(1.12)}5%{opacity:1;transform:none}93%{opacity:1;transform:none}97%,100%{opacity:0;transform:translateY(-20px)}}
@keyframes draw{0%{stroke-dashoffset:760}7%{stroke-dashoffset:0}93%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes fade{0%{opacity:0}5%{opacity:1}93%{opacity:1}97%,100%{opacity:0}}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(1440px)}}
#a,#b{transform-box:fill-box;transform-origin:left bottom}
#a{animation:slam 8s cubic-bezier(0.16,1,0.3,1) 0.5s infinite both}#b{animation:slam 8s cubic-bezier(0.16,1,0.3,1) 1.5s infinite both}
#u{stroke-dasharray:760;animation:draw 8s cubic-bezier(0.16,1,0.3,1) 2.5s infinite both}
#c{animation:fade 8s ease-out 3s infinite both}
#p{animation:run 8s linear 0s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.6" fill="#26262a"/></pattern></defs><rect width="1600" height="600" fill="#0b0b0c"/><rect width="1600" height="600" fill="url(#g)"/>
<text class="w" x="80" y="92">MOTION-DIRECTOR</text>
<text id="a" class="h" x="76" y="270">ONE LINE IN.</text>
<text id="b" class="h" x="76" y="430" fill="#ffd400" style="fill:#ffd400">A FILM OUT.</text>
<path id="u" d="M82 452 C 260 440, 520 462, 800 448" fill="none" stroke="#f2efe6" stroke-width="7" stroke-linecap="round"/>
<text id="c" class="s" x="880" y="418">A film crew of agents for Claude Code.</text>
<line x1="80" y1="530" x2="1520" y2="530" stroke="#3a3a3f" stroke-width="2"/>
<line x1="80" y1="498" x2="80" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="170" y1="510" x2="170" y2="530" stroke="#f2efe6" stroke-width="4"/><line x1="260" y1="510" x2="260" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="350" y1="510" x2="350" y2="530" stroke="#f2efe6" stroke-width="4"/><line x1="440" y1="498" x2="440" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="530" y1="510" x2="530" y2="530" stroke="#f2efe6" stroke-width="4"/><line x1="620" y1="510" x2="620" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="710" y1="510" x2="710" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="800" y1="498" x2="800" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="890" y1="510" x2="890" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="980" y1="510" x2="980" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="1070" y1="510" x2="1070" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="1160" y1="498" x2="1160" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="1250" y1="510" x2="1250" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="1340" y1="510" x2="1340" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="1430" y1="510" x2="1430" y2="530" stroke="#3a3a3f" stroke-width="2"/><line x1="1520" y1="498" x2="1520" y2="530" stroke="#3a3a3f" stroke-width="2"/>
<g id="p"><line x1="80" y1="486" x2="80" y2="544" stroke="#ffd400" stroke-width="5"/><circle cx="80" cy="486" r="8" fill="#ffd400"/></g>
</svg>