<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="The crew: intake, crew, storyboard, build, critics, debrief">
<style>
.t{font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif;font-size:64px;fill:#f2efe6}
.n{font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif;font-size:44px;fill:#8a8780}
.p{font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif;font-size:44px;fill:#f2efe6}
.a{font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Black', sans-serif;font-size:38px;fill:#8a8780;transform-box:fill-box;transform-origin:left center}
.d{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:25px;font-weight:600;fill:#8a8780}
.c{fill:#0b0b0c;stroke:#3a3a3f;stroke-width:3}
@keyframes cell{0%,15%{stroke:#f2efe6}18%,100%{stroke:#3a3a3f}}
@keyframes num{0%,15%{fill:#ffd400}18%,100%{fill:#8a8780}}
@keyframes lit{0%{fill:#f2efe6;transform:scale(1.1)}3%{fill:#f2efe6;transform:none}14%{fill:#f2efe6}18%,100%{fill:#8a8780;transform:none}}
#c0{animation:cell 12s linear -12.00s infinite both}#n0{animation:num 12s linear -12.00s infinite both}
#a00{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -11.80s infinite both}
#c1{animation:cell 12s linear -10.00s infinite both}#n1{animation:num 12s linear -10.00s infinite both}
#a10{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -9.80s infinite both}
#a11{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -9.52s infinite both}
#a12{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -9.24s infinite both}
#a13{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -8.96s infinite both}
#a14{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -8.68s infinite both}
#c2{animation:cell 12s linear -8.00s infinite both}#n2{animation:num 12s linear -8.00s infinite both}
#a20{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -7.80s infinite both}
#a21{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -7.52s infinite both}
#c3{animation:cell 12s linear -6.00s infinite both}#n3{animation:num 12s linear -6.00s infinite both}
#a30{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -5.80s infinite both}
#a31{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -5.52s infinite both}
#a32{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -5.24s infinite both}
#c4{animation:cell 12s linear -4.00s infinite both}#n4{animation:num 12s linear -4.00s infinite both}
#a40{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -3.80s infinite both}
#a41{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -3.52s infinite both}
#a42{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -3.24s infinite both}
#c5{animation:cell 12s linear -2.00s infinite both}#n5{animation:num 12s linear -2.00s infinite both}
#a50{animation:lit 12s cubic-bezier(0.16,1,0.3,1) -1.80s infinite both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.6" fill="#26262a"/></pattern></defs><rect width="1600" height="1000" fill="#0b0b0c"/><rect width="1600" height="1000" fill="url(#g)"/>
<text class="t" x="80" y="92">THE CREW, IN ORDER.</text>
<rect id="c0" class="c" x="80" y="130" width="470" height="400"/><text id="n0" class="n" x="108" y="194">01</text><text class="p" x="172" y="194">INTAKE</text><line x1="80" y1="218" x2="550" y2="218" stroke="#3a3a3f" stroke-width="3"/><text id="a00" class="a" x="108" y="268">PRODUCER</text><text class="d" x="108" y="506">reads your quota, pitches 3 ideas</text><rect id="c1" class="c" x="575" y="130" width="470" height="400"/><text id="n1" class="n" x="603" y="194">02</text><text class="p" x="667" y="194">CREW</text><line x1="575" y1="218" x2="1045" y2="218" stroke="#3a3a3f" stroke-width="3"/><text id="a10" class="a" x="603" y="268">SCOUT</text><text id="a11" class="a" x="603" y="314">RESEARCHER</text><text id="a12" class="a" x="603" y="360">SCRIPTWRITER</text><text id="a13" class="a" x="603" y="406">ART DIRECTOR</text><text id="a14" class="a" x="603" y="452">ASSET HUNTER</text><text class="d" x="603" y="506">trends, references, script, looks</text><rect id="c2" class="c" x="1070" y="130" width="470" height="400"/><text id="n2" class="n" x="1098" y="194">03</text><text class="p" x="1162" y="194">STORYBOARD</text><line x1="1070" y1="218" x2="1540" y2="218" stroke="#3a3a3f" stroke-width="3"/><text id="a20" class="a" x="1098" y="268">BOARD CRITIC</text><text id="a21" class="a" x="1098" y="314">YOU</text><text class="d" x="1098" y="506">you approve before anything is built</text><rect id="c3" class="c" x="80" y="555" width="470" height="400"/><text id="n3" class="n" x="108" y="619">04</text><text class="p" x="172" y="619">BUILD</text><line x1="80" y1="643" x2="550" y2="643" stroke="#3a3a3f" stroke-width="3"/><text id="a30" class="a" x="108" y="693">DIRECTOR</text><text id="a31" class="a" x="108" y="739">EDITOR</text><text id="a32" class="a" x="108" y="785">SOUND DESIGNER</text><text class="d" x="108" y="931">sample first, then the whole film</text><rect id="c4" class="c" x="575" y="555" width="470" height="400"/><text id="n4" class="n" x="603" y="619">05</text><text class="p" x="667" y="619">CRITICS</text><line x1="575" y1="643" x2="1045" y2="643" stroke="#3a3a3f" stroke-width="3"/><text id="a40" class="a" x="603" y="693">VIEWER</text><text id="a41" class="a" x="603" y="739">CRAFT</text><text id="a42" class="a" x="603" y="785">SOUND</text><text class="d" x="603" y="931">three views, each judging alone</text><rect id="c5" class="c" x="1070" y="555" width="470" height="400"/><text id="n5" class="n" x="1098" y="619">06</text><text class="p" x="1162" y="619">DEBRIEF</text><line x1="1070" y1="643" x2="1540" y2="643" stroke="#3a3a3f" stroke-width="3"/><text id="a50" class="a" x="1098" y="693">MEMORY</text><text class="d" x="1098" y="931">your verdict shapes the next film</text>
</svg>